server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Оставляем только контейнеры, в имени которых есть "rag-"
          - name: name
            values: ["rag-"]
    relabel_configs:
      # Извлекаем имя контейнера как метку (убираем слэш)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # Извлекаем имя сервиса из compose (например, rag-api-gateway-1 -> api-gateway)
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
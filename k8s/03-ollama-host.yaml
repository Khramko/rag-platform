apiVersion: v1
kind: Service
metadata:
  name: ollama-host
  namespace: rag
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-host
  namespace: rag
subsets:
  - addresses:
      - ip: 192.168.11.171   # реальный IP хоста
    ports:
      - name: http
        port: 11434
        protocol: TCP
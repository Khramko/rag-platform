apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api-gateway
  namespace: rag
  labels:
    app: rag-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api-gateway
  template:
    metadata:
      labels:
        app: rag-api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api-gateway
          image: rag/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          env:
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://jaeger:4318/v1/traces"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-gateway
  namespace: rag
  labels:
    app: rag-api-gateway
spec:
  selector:
    app: rag-api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
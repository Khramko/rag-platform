apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-embedding-service
  namespace: rag
  labels:
    app: rag-embedding-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-embedding-service
  template:
    metadata:
      labels:
        app: rag-embedding-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: embedding-service
          image: rag/embedding-service:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              name: http
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-embedding-service
  namespace: rag
  labels:
    app: rag-embedding-service
spec:
  selector:
    app: rag-embedding-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
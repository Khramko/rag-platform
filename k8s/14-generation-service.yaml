apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-generation-service
  namespace: rag
  labels:
    app: rag-generation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-generation-service
  template:
    metadata:
      labels:
        app: rag-generation-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8085"
    spec:
      containers:
        - name: generation-service
          image: rag/generation-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          env:
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://jaeger:4318/v1/traces"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-generation-service
  namespace: rag
  labels:
    app: rag-generation-service
spec:
  selector:
    app: rag-generation-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
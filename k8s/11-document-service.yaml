apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-document-service
  namespace: rag
  labels:
    app: rag-document-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-document-service
  template:
    metadata:
      labels:
        app: rag-document-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: document-service
          image: rag/document-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-document-service
  namespace: rag
  labels:
    app: rag-document-service
spec:
  selector:
    app: rag-document-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-minio-create-bucket
  namespace: rag
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rag-minio 9000; do
                echo "waiting for minio..."; sleep 2;
              done
      containers:
        - name: aws-cli
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - sh
            - -c
            - |
              # Ждём, пока S3 API ответит (init-контейнер проверяет только TCP)
              until aws --endpoint-url http://rag-minio:9000 s3 ls >/dev/null 2>&1; do
                echo "waiting for S3 API..."; sleep 2;
              done
              # Создаём bucket (идемпотентно: если есть — ошибку игнорируем)
              aws --endpoint-url http://rag-minio:9000 s3 mb s3://documents || true
              aws --endpoint-url http://rag-minio:9000 s3 ls
<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Документы — RAG Chat</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <h1>RAG Chat</h1>
            <nav>
                <a href="index.html">Чат</a>
                <a href="documents.html" class="active">Документы</a>
                <span id="user-info"></span>
                <button onclick="logout()" class="logout-btn">Выйти</button>
            </nav>
        </header>

        <main class="documents-container">
            <section class="upload-section">
                <h2>Загрузить документ</h2>
                <form id="upload-form">
                    <input
                        type="file"
                        id="file"
                        accept=".txt,.pdf,.docx,.md,.html"
                        required
                    />
                    <button type="submit" id="upload-btn">Загрузить</button>
                </form>
                <div id="upload-status"></div>
                <p class="hint">
                    После загрузки документ обрабатывается (парсинг, чанкинг,
                    эмбеддинг). Через 5–10 секунд он будет доступен в чате.
                </p>
            </section>

            <section class="list-section">
                <div class="section-header">
                    <h2>Мои документы</h2>
                    <button id="refresh-btn">Обновить</button>
                </div>
                <table id="documents-table">
                    <thead>
                        <tr>
                            <th>Имя файла</th>
                            <th>Тип</th>
                            <th>Размер</th>
                            <th>Статус</th>
                            <th>Загружен</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="documents-body">
                        <tr>
                            <td colspan="6" class="empty-state">Загрузка…</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>

        <script src="js/auth.js"></script>
        <script src="js/api.js"></script>
        <script src="js/documents.js"></script>
        <script>
            requireAuth();
            const user = getUser();
            if (user)
                document.getElementById("user-info").textContent = user.email;
        </script>
    </body>
</html>
